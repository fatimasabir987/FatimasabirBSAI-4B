<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nest & Co. — Hotel QnA Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #faf7f2;
    --card:         #fffcf8;
    --brown:        #7c5c3e;
    --brown-light:  #a07850;
    --peach:        #f0c8a8;
    --peach-dim:    rgba(240,200,168,0.2);
    --sage:         #6b8f71;
    --sage-light:   #b5c9b0;
    --border:       rgba(124,92,62,0.16);
    --text:         #3a2e24;
    --muted:        #9a8070;
    --light-text:   #c4aa94;
    --result-1:     #fff8f2;
    --result-2:     #f8fff8;
    --result-3:     #f8f8ff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(240,200,168,0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(107,143,113,0.18) 0%, transparent 50%);
  }

  /* Floating decos */
  .deco { position: fixed; pointer-events: none; opacity: 0.18; font-size: 56px; animation: floatY 9s ease-in-out infinite; }
  .d1 { top: 8%;  right: 4%;  animation-delay: 0s; }
  .d2 { bottom: 14%; left: 3%; font-size: 44px; animation-delay: 3s; animation-direction: reverse; }
  .d3 { top: 50%; right: 2%;  font-size: 32px; animation-delay: 6s; }
  @keyframes floatY {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }

  /* ── Layout ── */
  .page { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 40px; }

  .logo-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }

  .blob {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--peach), var(--sage-light));
    border-radius: 50% 40% 55% 35% / 40% 55% 45% 60%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    animation: wobble 7s ease-in-out infinite;
    box-shadow: 0 6px 20px rgba(240,200,168,0.45);
  }
  @keyframes wobble {
    0%,100% { border-radius: 50% 40% 55% 35% / 40% 55% 45% 60%; }
    33%      { border-radius: 40% 60% 35% 55% / 55% 35% 60% 40%; }
    66%      { border-radius: 60% 35% 50% 45% / 35% 60% 40% 55%; }
  }

  h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--brown); }

  .subtitle {
    font-size: 0.72rem; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); margin-top: 4px; font-weight: 300;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 5px 14px; border-radius: 30px;
    background: rgba(107,143,113,0.1); border: 1px solid rgba(107,143,113,0.25);
    font-size: 0.72rem; color: var(--sage); font-weight: 500;
  }
  .badge-dot { width:6px;height:6px;border-radius:50%;background:var(--sage); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.75);} }

  /* ── Search box ── */
  .search-wrap { margin-bottom: 28px; }

  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 10px 10px 10px 22px;
    box-shadow: 0 4px 24px rgba(124,92,62,0.1);
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within {
    border-color: var(--brown-light);
    box-shadow: 0 6px 30px rgba(124,92,62,0.16);
  }

  #queryInput {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    color: var(--text); font-weight: 400;
  }
  #queryInput::placeholder { color: var(--light-text); }

  #searchBtn {
    width: 42px; height: 42px; border: none; border-radius: 50%;
    background: linear-gradient(135deg, var(--brown), var(--brown-light));
    color: #fff8f0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  #searchBtn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(124,92,62,0.3); }
  #searchBtn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ── Suggested queries ── */
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }

  .sug {
    font-family: 'DM Sans', sans-serif; font-size: 0.76rem;
    padding: 6px 14px; border-radius: 30px;
    border: 1.5px solid var(--border);
    background: var(--card); color: var(--brown);
    cursor: pointer; transition: all .2s;
    box-shadow: 0 1px 5px rgba(124,92,62,0.06);
  }
  .sug:hover {
    background: rgba(240,200,168,0.2); border-color: var(--brown-light);
    transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,92,62,0.1);
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px;
  }
  .stat-chip {
    font-size: 0.74rem; padding: 5px 12px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted);
  }
  .stat-chip span { color: var(--brown); font-weight: 600; }

  /* ── Results ── */
  #resultsArea { display: flex; flex-direction: column; gap: 16px; }

  /* loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, #f0ebe4 25%, #faf7f2 50%, #f0ebe4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 16px; height: 110px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* result card */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 3px 16px rgba(124,92,62,0.07);
    animation: cardIn .35s ease both;
    position: relative; overflow: hidden;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  .result-card:nth-child(1) { border-left: 4px solid var(--peach); }
  .result-card:nth-child(2) { border-left: 4px solid var(--sage-light); animation-delay:.07s; }
  .result-card:nth-child(3) { border-left: 4px solid #b0b8e0; animation-delay:.14s; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }

  .rank-badge {
    font-family: 'Caveat', cursive; font-size: 1rem;
    color: var(--brown-light); font-weight: 600; flex-shrink: 0;
  }

  .cat-tag {
    font-size: 0.68rem; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px;
    background: var(--peach-dim); color: var(--brown);
    font-weight: 500; flex-shrink: 0;
  }

  .matched-q {
    font-family: 'Caveat', cursive; font-size: 0.9rem;
    color: var(--sage); margin-bottom: 8px; font-style: italic;
  }

  .answer-text {
    font-size: 0.92rem; line-height: 1.7; color: var(--text);
    font-weight: 300;
  }

  .dist-label {
    margin-top: 12px; font-size: 0.68rem; color: var(--light-text);
    letter-spacing: 0.5px;
  }
  .dist-bar-wrap { height: 4px; background: #ece6de; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .dist-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--sage), var(--peach)); transition: width .6s ease; }

  /* empty / error states */
  .state-msg {
    text-align: center; padding: 50px 20px;
    font-family: 'Caveat', cursive; font-size: 1.2rem; color: var(--muted);
  }
  .state-msg .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

  /* ── Query display ── */
  .query-display {
    display: none; margin-bottom: 16px;
    background: rgba(240,200,168,0.12);
    border: 1px solid rgba(240,200,168,0.4);
    border-radius: 12px; padding: 10px 16px;
    font-size: 0.84rem; color: var(--brown);
  }
  .query-display.visible { display: block; }
  .query-display strong { font-family: 'Caveat', cursive; font-size: 1rem; }
</style>
</head>
<body>

<div class="deco d1">🌿</div>
<div class="deco d2">☕</div>
<div class="deco d3">🕯️</div>

<div class="page">

  <!-- Header -->
  <header>
    <div class="logo-row">
      <div class="blob">🏡</div>
      <h1>Nest & Co.</h1>
    </div>
    <div class="subtitle">Hotel Information QnA Bot</div>
    <div class="badge"><div class="badge-dot"></div> FAISS-powered semantic search</div>
  </header>

  <!-- Stats bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-chip">Dataset <span>56</span> QnA pairs</div>
    <div class="stat-chip">Model <span>TF-IDF + FAISS</span></div>
    <div class="stat-chip">Categories <span>8</span></div>
    <div class="stat-chip">Top-K <span>3 results</span></div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="ask anything about the hotel..." autocomplete="off">
      <button id="searchBtn" onclick="doSearch()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions">
    <button class="sug" onclick="fillAndSearch('what rooms do you have?')">🛏 rooms available</button>
    <button class="sug" onclick="fillAndSearch('what is the penthouse price?')">💰 penthouse price</button>
    <button class="sug" onclick="fillAndSearch('is there a swimming pool?')">🏊 pool</button>
    <button class="sug" onclick="fillAndSearch('do you allow pets?')">🐾 pets</button>
    <button class="sug" onclick="fillAndSearch('how do I make a booking?')">📅 booking</button>
    <button class="sug" onclick="fillAndSearch('is wifi free?')">📶 wifi</button>
    <button class="sug" onclick="fillAndSearch('what is the cancellation policy?')">🔄 cancellation</button>
    <button class="sug" onclick="fillAndSearch('airport shuttle service')">✈️ airport</button>
  </div>

  <!-- Query display -->
  <div class="query-display" id="queryDisplay">
    🔍 Showing results for: <strong id="queryText"></strong>
  </div>

  <!-- Results -->
  <div id="resultsArea">
    <div class="state-msg">
      <span class="emoji">🌿</span>
      type a question or tap a suggestion above
    </div>
  </div>

</div>

<script>
  const input   = document.getElementById('queryInput');
  const btn     = document.getElementById('searchBtn');
  const area    = document.getElementById('resultsArea');
  const qDisp   = document.getElementById('queryDisplay');
  const qText   = document.getElementById('queryText');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  function fillAndSearch(q) {
    input.value = q;
    doSearch();
  }

  function showSkeletons() {
    area.innerHTML = [1,2,3].map(() =>
      `<div class="skeleton"></div>`
    ).join('');
  }

  // Similarity → bar width (lower L2 distance = higher similarity)
  // Map distance [0, 2] → bar width [95%, 20%]
  function distToBar(dist) {
    const pct = Math.max(20, Math.min(95, 95 - (dist / 2) * 75));
    return pct.toFixed(1);
  }

  function distToLabel(dist) {
    if (dist < 0.3)  return 'very high match ✨';
    if (dist < 0.7)  return 'high match 🌿';
    if (dist < 1.2)  return 'good match';
    if (dist < 1.8)  return 'partial match';
    return 'low match';
  }

  const rankEmojis = ['🥇', '🥈', '🥉'];
  const catColors  = {
    'General':   '#f0c8a8',
    'Rooms':     '#b5c9b0',
    'Dining':    '#f8d7a8',
    'Amenities': '#a8d8ea',
    'Business':  '#d4a8f0',
    'Booking':   '#f0a8c8',
    'Policies':  '#c8f0a8',
    'Packages':  '#f0e0a8',
  };

  async function doSearch() {
    const q = input.value.trim();
    if (!q) return;

    btn.disabled = true;
    showSkeletons();
    qText.textContent = q;
    qDisp.classList.add('visible');

    try {
      const res  = await fetch('/search', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ query: q })
      });
      const data = await res.json();

      if (data.error || !data.results.length) {
        area.innerHTML = `<div class="state-msg"><span class="emoji">🤔</span>no results found — try a different question</div>`;
      } else {
        area.innerHTML = data.results.map((r, i) => {
          const barW = distToBar(r.distance);
          const catColor = catColors[r.category] || '#e0d8d0';
          return `
          <div class="result-card" style="animation-delay:${i * 0.07}s">
            <div class="card-top">
              <div class="rank-badge">${rankEmojis[i]} Result #${r.rank}</div>
              <div class="cat-tag" style="background:${catColor}33;color:${r.category==='General'?'#8a5c30':'#2a5a3a'}">${r.category}</div>
            </div>
            <div class="matched-q">matched: "${r.question}"</div>
            <div class="answer-text">${r.answer}</div>
            <div class="dist-label">similarity — ${distToLabel(r.distance)} (L2 distance: ${r.distance})</div>
            <div class="dist-bar-wrap"><div class="dist-bar" style="width:${barW}%"></div></div>
          </div>`;
        }).join('');
      }
    } catch (err) {
      area.innerHTML = `<div class="state-msg"><span class="emoji">😅</span>something went wrong — is the server running?</div>`;
    }

    btn.disabled = false;
  }
</script>
</body>
</html>
